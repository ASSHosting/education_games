<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Datenschutz-Simulator · BDS-Akademie Modul 3.1</title>
<meta name="description" content="Entscheidungs-Simulator für KMU: Darfst du das in KI eingeben? 12 Szenarien aus dem Alltag.">
<style>
  :root {
    --bds-dark:  #004059;
    --bds-blue:  #2895D2;
    --bds-bg:    #F7F8FB;
    --text:      #1E2B32;
    --muted:     #5A6B78;
    --border:    #E2E8EE;
    --card:      #FFFFFF;
    --green:     #2FA04F;
    --yellow:    #E8B923;
    --red:       #C83C3C;
    --shadow:    0 2px 8px rgba(0,64,89,0.08);
    --shadow-lg: 0 8px 24px rgba(0,64,89,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bds-bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 16px;
  }

  .app {
    max-width: 780px;
    margin: 0 auto;
    padding-top: 8px;
  }

  /* ========= HEADER ========= */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 8px 4px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand img { width: 32px; height: 32px; border-radius: 50%; }
  .brand-text {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    font-weight: 600;
  }
  .brand-text strong {
    display: block;
    color: var(--bds-dark);
    font-size: 13px;
    letter-spacing: 0;
    font-weight: 700;
  }
  .score-pill {
    background: var(--bds-dark);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .score-pill.visible { display: block; }
  .score-pill .num { color: var(--bds-blue); }

  /* ========= PROGRESS ========= */
  .progress-wrap {
    margin-bottom: 24px;
    display: none;
  }
  .progress-wrap.visible { display: block; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--bds-blue);
    transition: width 0.4s ease;
    border-radius: 3px;
  }

  /* ========= CARD / SCREEN ========= */
  .screen {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 28px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ========= START SCREEN ========= */
  .start-hero { text-align: left; }
  .start-tag {
    display: inline-block;
    background: var(--bds-blue);
    color: #fff;
    padding: 4px 12px;
    border-radius: 3px;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .start-title {
    font-size: 36px;
    line-height: 1.1;
    color: var(--bds-dark);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .start-title .sub { font-weight: 300; display: block; }
  .start-sub {
    color: var(--bds-blue);
    font-size: 16px;
    font-style: italic;
    margin-bottom: 24px;
  }
  .start-desc {
    color: var(--text);
    font-size: 15px;
    margin-bottom: 8px;
  }
  .start-meta {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 24px 0;
    padding: 16px;
    background: var(--bds-bg);
    border-radius: 8px;
  }
  .start-meta div {
    text-align: center;
  }
  .start-meta strong {
    display: block;
    color: var(--bds-dark);
    font-size: 20px;
    font-weight: 700;
  }
  .start-meta span {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .how-it-works {
    background: var(--bds-dark);
    color: #fff;
    padding: 16px 20px;
    border-radius: 8px;
    margin: 20px 0 24px;
  }
  .how-it-works h4 {
    color: var(--bds-blue);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .how-it-works ul {
    list-style: none;
    font-size: 14px;
    line-height: 1.7;
  }
  .how-it-works li::before {
    content: "→ ";
    color: var(--bds-blue);
    font-weight: 700;
  }

  /* ========= BUTTONS ========= */
  .btn {
    display: inline-block;
    background: var(--bds-blue);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    width: 100%;
    text-align: center;
  }
  .btn:hover { background: #2380BC; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-secondary {
    background: #fff;
    color: var(--bds-dark);
    border: 1.5px solid var(--bds-dark);
  }
  .btn-secondary:hover { background: var(--bds-bg); }

  /* ========= SCENARIO ========= */
  .scenario-num {
    color: var(--bds-blue);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .scenario-category {
    display: inline-block;
    background: var(--bds-bg);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 3px;
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: 600;
    text-transform: uppercase;
    margin-left: 8px;
  }
  .scenario-title {
    color: var(--bds-dark);
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 14px;
    line-height: 1.25;
  }
  .scenario-situation {
    background: var(--bds-bg);
    padding: 16px 18px;
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    border-left: 4px solid var(--bds-blue);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .scenario-question {
    color: var(--bds-dark);
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }

  /* ========= OPTIONS ========= */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: #fff;
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    line-height: 1.4;
  }
  .option:hover {
    border-color: var(--bds-blue);
    background: #F0F8FC;
    transform: translateX(2px);
  }
  .option:active { transform: translateX(0); }
  .option-letter {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    background: var(--bds-dark);
    color: #fff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
  }
  .option:hover .option-letter { background: var(--bds-blue); }

  /* ========= FEEDBACK ========= */
  .feedback {
    animation: fadeIn 0.3s ease;
  }
  .feedback-banner {
    padding: 20px 22px;
    border-radius: 10px;
    margin-bottom: 20px;
    color: #fff;
  }
  .feedback-banner.green  { background: var(--green); }
  .feedback-banner.yellow { background: var(--yellow); color: #3a2b05; }
  .feedback-banner.red    { background: var(--red); }
  .feedback-label {
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 700;
    opacity: 0.9;
    margin-bottom: 4px;
  }
  .feedback-verdict {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .feedback-points {
    font-size: 13px;
    opacity: 0.9;
  }
  .feedback-body {
    padding: 20px 22px;
    background: var(--bds-bg);
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .feedback-body h4 {
    color: var(--bds-blue);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .feedback-body p {
    font-size: 14px;
    margin-bottom: 12px;
    line-height: 1.55;
  }
  .feedback-body p:last-child { margin-bottom: 0; }
  .feedback-reference {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* ========= RESULT ========= */
  .result-hero {
    text-align: center;
    padding: 20px 0;
  }
  .result-score {
    font-size: 64px;
    font-weight: 700;
    color: var(--bds-blue);
    line-height: 1;
  }
  .result-score .max {
    color: var(--muted);
    font-size: 30px;
    font-weight: 400;
  }
  .result-badge {
    display: inline-block;
    background: var(--bds-dark);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 14px 0 8px;
  }
  .result-verdict {
    font-size: 20px;
    font-weight: 700;
    color: var(--bds-dark);
    margin-bottom: 8px;
  }
  .result-sub {
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    margin-bottom: 28px;
  }
  .profile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .profile-item {
    background: var(--bds-bg);
    padding: 14px;
    border-radius: 8px;
    text-align: left;
  }
  .profile-item .label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .profile-item .value {
    font-size: 20px;
    color: var(--bds-dark);
    font-weight: 700;
  }
  .profile-item .bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .profile-item .bar-fill {
    height: 100%;
    border-radius: 2px;
  }
  .result-tip {
    background: var(--bds-dark);
    color: #fff;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .result-tip h4 {
    color: var(--bds-blue);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .result-tip p {
    font-size: 14px;
    line-height: 1.55;
  }
  .result-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-actions .btn { flex: 1; min-width: 200px; }

  /* ========= FOOTER ========= */
  footer {
    text-align: center;
    padding: 24px 0 8px;
    font-size: 11px;
    color: var(--muted);
  }
  footer a { color: var(--bds-blue); text-decoration: none; }

  /* ========= MOBILE ========= */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .screen { padding: 20px; border-radius: 8px; }
    .start-title { font-size: 28px; }
    .start-meta { grid-template-columns: 1fr; }
    .start-meta strong { font-size: 18px; }
    .scenario-title { font-size: 18px; }
    .profile-grid { grid-template-columns: 1fr; }
    .result-score { font-size: 52px; }
  }
</style>
</head>

// STATE
// ============================================================
let currentIdx = 0;
let scoreTotal = 0;
let scoreByDimension = { P: 0, T: 0, V: 0, R: 0 };
let maxByDimension = { P: 0, T: 0, V: 0, R: 0 };
let answers = []; // {scenarioNum, letter, points}

// Dimension-Totals zählen
scenarios.forEach(sc => { maxByDimension[sc.dimension] += 3; });

// ============================================================
// RENDERING
// ============================================================

const content = document.getElementById('content');
const scorePill = document.getElementById('scorePill');
const currentScoreEl = document.getElementById('currentScore');
const progressWrap = document.getElementById('progressWrap');
const progressLabel = document.getElementById('progressLabel');
const progressPercent = document.getElementById('progressPercent');
const progressFill = document.getElementById('progressFill');

function updateProgress() {
  const done = answers.length;
  const pct = Math.round((done / scenarios.length) * 100);
  progressLabel.textContent = `Szenario ${Math.min(currentIdx + 1, scenarios.length)} von ${scenarios.length}`;
  progressPercent.textContent = pct + ' %';
  progressFill.style.width = pct + '%';
  currentScoreEl.textContent = scoreTotal;
}

function renderStart() {
  progressWrap.classList.remove('visible');
  scorePill.classList.remove('visible');
  content.innerHTML = `
    <div class="screen">
      <div class="start-hero">
        <span class="start-tag">KI-AKADEMIE · M3.1</span>
        <h1 class="start-title">KI-Datenschutz<span class="sub">Entscheidungs-Simulator</span></h1>
        <p class="start-sub">Vom Kennen zum Können – 12 Szenarien aus dem KMU-Alltag.</p>

        <p class="start-desc">
          In den nächsten 10–15 Minuten triffst du 12 Entscheidungen, wie sie in jedem Mittelstandsbetrieb
          täglich vorkommen. Du bekommst sofort Feedback – warum eine Option richtig, akzeptabel oder riskant ist.
        </p>

        <div class="start-meta">
          <div><strong>12</strong><span>Szenarien</span></div>
          <div><strong>36</strong><span>Max. Punkte</span></div>
          <div><strong>~15 Min</strong><span>Dauer</span></div>
        </div>

        <div class="how-it-works">
          <h4>SO GEHT'S</h4>
          <ul>
            <li>Lies das Szenario ruhig durch.</li>
            <li>Wähle die Antwort, die du im echten Betrieb geben würdest.</li>
            <li>Nach jeder Antwort: Feedback mit Begründung und Quelle.</li>
            <li>Am Ende: Auswertung deines Profils + Empfehlungen.</li>
          </ul>
        </div>

        <button class="btn" onclick="startGame()">Jetzt starten →</button>
      </div>
    </div>
  `;
}

function renderScenario() {
  const s = scenarios[currentIdx];
  progressWrap.classList.add('visible');
  scorePill.classList.add('visible');
  updateProgress();

  const optionsHTML = s.options.map(o => `
    <button class="option" onclick="selectOption('${o.letter}')">
      <span class="option-letter">${o.letter}</span>
      <span>${escapeHTML(o.text)}</span>
    </button>
  `).join('');

  content.innerHTML = `
    <div class="screen">
      <div class="scenario-num">SZENARIO ${s.num} / 12<span class="scenario-category">${s.category}</span></div>
      <h2 class="scenario-title">${escapeHTML(s.title)}</h2>
      <div class="scenario-situation">${escapeHTML(s.situation)}</div>
      <div class="scenario-question">${escapeHTML(s.question)}</div>
      <div class="options">${optionsHTML}</div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(letter) {
  const s = scenarios[currentIdx];
  const o = s.options.find(op => op.letter === letter);
  scoreTotal += o.points;
  scoreByDimension[s.dimension] += o.points;
  answers.push({ num: s.num, letter, points: o.points });

  const labelMap = { green: 'RICHTIG', yellow: 'AKZEPTABEL, ABER…', red: 'RISKANT' };
  const verdictMap = {
    green: 'Gute Entscheidung.',
    yellow: 'Nicht falsch – aber nicht optimal.',
    red: 'Das würde dich in Schwierigkeiten bringen.',
  };

  content.innerHTML = `
    <div class="screen feedback">
      <div class="feedback-banner ${o.color}">
        <div class="feedback-label">${labelMap[o.color]}</div>
        <div class="feedback-verdict">${verdictMap[o.color]}</div>
        <div class="feedback-points">+${o.points} von 3 Punkten · Antwort ${letter}</div>
      </div>

      <div class="feedback-body">
        <h4>WARUM</h4>
        <p>${escapeHTML(o.feedback)}</p>
        <div class="feedback-reference">Weiterlesen: ${escapeHTML(s.reference)}</div>
      </div>

      <button class="btn" onclick="nextScenario()">
        ${currentIdx < scenarios.length - 1 ? 'Weiter zum nächsten Szenario →' : 'Zur Auswertung →'}
      </button>
    </div>
  `;
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextScenario() {
  currentIdx++;
  if (currentIdx >= scenarios.length) {
    renderResult();
  } else {
    renderScenario();
  }
}

function renderResult() {
  progressWrap.classList.remove('visible');
  const max = scenarios.length * 3;
  const pct = Math.round((scoreTotal / max) * 100);

  let badge, verdict, sub;
  if (scoreTotal >= 30) {
    badge = 'KI-DATENSCHUTZ-PROFI';
    verdict = 'Du weißt, was du tust.';
    sub = 'Deine Einschätzung ist sicher genug, um dein Team zu leiten. Nutze die Handouts, um dein Wissen einzubetten.';
  } else if (scoreTotal >= 22) {
    badge = 'DSGVO-BEWUSST';
    verdict = 'Solide Basis – mit Finetuning wirst du Profi.';
    sub = 'Dir fehlen an ein paar Stellen die Details. Die Handouts schließen die Lücken, und in 2–3 Monaten bist du oben.';
  } else if (scoreTotal >= 14) {
    badge = 'IM AUFBAU';
    verdict = 'Da ist noch Luft nach oben.';
    sub = 'Wichtige Grundlagen sind da – aber einige Bereiche brauchen Training. Die Handouts und M3.2 helfen systematisch weiter.';
  } else {
    badge = 'DRINGENDER HANDLUNGSBEDARF';
    verdict = 'Jetzt ist der richtige Moment zum Nachholen.';
    sub = "Keine Schande – du bist nicht allein. Nimm die Handouts, mach den AVV, führe die Richtlinie ein. In 4 Wochen sieht's anders aus.";
  }

  const dimLabels = {
    P: 'Personen­bezug erkennen',
    T: 'Werkzeug- und Lizenzwahl',
    V: 'Verfahrens-Wissen (Kennzeichnung, AVV, KI-VO)',
    R: 'Risiko-Einschätzung',
  };
  const profileHTML = Object.keys(dimLabels).map(dim => {
    const got = scoreByDimension[dim];
    const total = maxByDimension[dim];
    const p = Math.round((got / total) * 100);
    const barColor = p >= 75 ? 'var(--green)' : p >= 50 ? 'var(--yellow)' : 'var(--red)';
    return `
      <div class="profile-item">
        <div class="label">${dimLabels[dim]}</div>
        <div class="value">${got} / ${total}</div>
        <div class="bar"><div class="bar-fill" style="width: ${p}%; background: ${barColor};"></div></div>
      </div>
    `;
  }).join('');

  // Individuelle Empfehlung
  const weakest = Object.keys(scoreByDimension).reduce((a, b) =>
    (scoreByDimension[a] / maxByDimension[a]) < (scoreByDimension[b] / maxByDimension[b]) ? a : b
  );
  const tipMap = {
    P: 'Dein Schwerpunkt sollte Personenbezug sein: Bevor du in KI eingibst – frag dich IMMER: Könnte jemand diese Daten einer Person zuordnen? Handout 1 (DSGVO-Ampel) hilft beim schnellen Einschätzen.',
    T: 'Arbeite an deiner Werkzeug-Wahl: Welche Lizenz habe ich? Habe ich einen AVV? Handout 2 (AVV-Quickguide) und Handout 4 (Tool-Ampel) sind dein Nachschlagewerk.',
    V: 'Vertiefe dein Verfahrens-Wissen: KI-Kennzeichnung, AVV-Prozess, KI-VO. Handout 3 (KI-Richtlinie) und Modul 3.2 (AI Act am 28.04.) decken das komplett ab.',
    R: 'Schärfe dein Risiko-Gespür: Wo ist KI Hochrisiko (HR, Finanzen, Gesundheit)? Wo lohnt Vorsicht? Modul 3.2 behandelt Hochrisiko-Systeme im Detail.',
  };

  content.innerHTML = `
    <div class="screen">
      <div class="result-hero">
        <div class="result-score">${scoreTotal}<span class="max"> / ${max}</span></div>
        <div class="result-badge">${badge}</div>
        <div class="result-verdict">${verdict}</div>
        <div class="result-sub">${sub}</div>
      </div>

      <h3 style="color: var(--bds-dark); font-size: 14px; margin-bottom: 12px; letter-spacing: 1px;">DEIN PROFIL</h3>
      <div class="profile-grid">${profileHTML}</div>

      <div class="result-tip">
        <h4>DEIN NÄCHSTER SCHRITT</h4>
        <p>${tipMap[weakest]}</p>
      </div>

      <div class="result-actions">
        <button class="btn" onclick="restart()">Nochmal spielen</button>
        <button class="btn btn-secondary" onclick="window.print()">Ergebnis drucken</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startGame() {
  currentIdx = 0;
  scoreTotal = 0;
  scoreByDimension = { P: 0, T: 0, V: 0, R: 0 };
  answers = [];
  renderScenario();
}

function restart() {
  startGame();
}

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// === INIT ===
renderStart();
</script>
</body>
</html>
